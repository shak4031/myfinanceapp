<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Categorizations - MyFinanceApp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4a9eff;
      --primary-dark: #2e6fc4;
      --primary-light: #6ab5ff;
      --success: #51cf66;
      --danger: #ff6b6b;
      --warning: #ffd93d;
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #2a3f5f;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border: #333;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
      --transition: all 0.2s ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
    }

    .categorizations-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
    }

    /* TABS */
    .tab-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 12px 20px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
    }

    .tab-btn:hover {
      color: var(--text-primary);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    .tab-content.active {
      display: flex;
    }

    /* REVIEW & FIX MODE */
    .review-mode {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .transactions-table {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-secondary);
    }

    .transaction-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px 150px;
      gap: 12px;
      align-items: center;
      padding: 8px 12px;
      height: 35px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      background: var(--bg-secondary);
    }

    .transaction-row:hover {
      background: var(--bg-tertiary);
    }

    .transaction-row:last-child {
      border-bottom: none;
    }

    .transaction-date {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .transaction-desc {
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transaction-amount {
      text-align: right;
      font-weight: 600;
      color: var(--success);
    }

    .transaction-amount.expense {
      color: var(--danger);
    }

    .category-select {
      padding: 6px 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
    }

    .category-select:hover {
      border-color: var(--primary);
      background: var(--bg-primary);
    }

    .category-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.2);
    }

    .action-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* BULK EDITOR MODE */
    .bulk-container {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 16px;
      flex: 1;
      overflow: hidden;
    }

    .category-list {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-secondary);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .category-item {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .category-item:hover {
      background: var(--bg-tertiary);
    }

    .category-item.active {
      background: var(--primary);
      color: white;
    }

    .category-count {
      font-size: 12px;
      opacity: 0.7;
      font-weight: 600;
    }

    .bulk-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .date-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .date-filter input {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 13px;
    }

    .bulk-action {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .bulk-action select {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 4px;
      font-size: 13px;
    }

    .transaction-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* LEARNING MODE */
    .patterns-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pattern-card {
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pattern-info {
      flex: 1;
    }

    .pattern-keyword {
      font-weight: 600;
      color: var(--primary);
      font-size: 15px;
      margin-bottom: 8px;
    }

    .pattern-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 8px;
    }

    .pattern-stat {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pattern-categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .category-badge {
      padding: 4px 8px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .pattern-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-sm:hover {
      background: var(--border);
    }

    .btn-sm.yes {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .btn-sm.yes:hover {
      background: #4ab157;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s ease;
      max-width: 400px;
      z-index: 1000;
    }

    .toast.success {
      border-left: 4px solid var(--success);
      color: var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--danger);
      color: var(--danger);
    }

    .toast.info {
      border-left: 4px solid var(--primary);
      color: var(--primary);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .loading {
      text-align: center;
      color: var(--text-secondary);
      padding: 32px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top: 2px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .empty-state p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="categorizations-container">
    <div class="header">
      <h1>Transaction Categorizations</h1>
    </div>

    <div class="stats" id="statsContainer">
      <div class="stat">
        <div class="stat-label">Uncategorized</div>
        <div class="stat-value" id="uncategorizedCount">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Categorized</div>
        <div class="stat-value" id="categorizedCount">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Recently Corrected</div>
        <div class="stat-value" id="correctedCount">-</div>
      </div>
    </div>

    <div class="tab-container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="review">Review & Fix</button>
        <button class="tab-btn" data-tab="bulk">Bulk Editor</button>
        <button class="tab-btn" data-tab="learning">Learning Patterns</button>
      </div>

      <!-- REVIEW & FIX MODE -->
      <div class="tab-content active" id="review-tab">
        <div class="review-mode">
          <div class="transactions-table" id="reviewTable">
            <div class="loading">
              <div class="spinner"></div> Loading transactions...
            </div>
          </div>
          <div class="action-bar">
            <button class="btn btn-primary" id="saveChangesBtn">Save Changes</button>
            <span style="color: var(--text-secondary); font-size: 12px;" id="changesStatus"></span>
          </div>
        </div>
      </div>

      <!-- BULK EDITOR MODE -->
      <div class="tab-content" id="bulk-tab">
        <div class="bulk-container">
          <div class="category-list" id="categoryList">
            <div class="loading" style="padding: 16px;">
              <div class="spinner"></div>
            </div>
          </div>
          <div class="bulk-right">
            <div class="date-filter">
              <input type="date" id="bulkStartDate" placeholder="Start date">
              <input type="date" id="bulkEndDate" placeholder="End date">
            </div>
            <div class="bulk-action">
              <button class="btn btn-secondary" id="selectAllBtn">Select All</button>
              <select id="bulkCategorySelect">
                <option value="">Move selected to...</option>
              </select>
              <button class="btn btn-primary" id="bulkMoveBtn" disabled>Move</button>
            </div>
            <div class="transactions-table" id="bulkTable">
              <div class="empty-state">
                <h3>Select a category to view</h3>
                <p>Choose a category from the left panel</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- LEARNING MODE -->
      <div class="tab-content" id="learning-tab">
        <div class="patterns-list" id="patternsList">
          <div class="loading">
            <div class="spinner"></div> Analyzing patterns...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/categorizations';
    const CATEGORIES = [
      'Groceries', 'Utilities', 'Gas', 'Dining', 'Shopping', 'Entertainment',
      'Healthcare', 'Insurance', 'Subscriptions', 'Transportation', 'Childcare',
      'Education', 'Pet Care', 'Travel', 'Gifts', 'Home', 'Maintenance', 'Repairs',
      'Professional Services', 'Taxes', 'Salary', 'Bonus', 'Investments', 'Other'
    ];

    let pendingChanges = new Map(); // { id: newCategory }
    let selectedCheckboxes = new Set();
    let currentCategory = null;

    // Show toast notification
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`${tabName}-tab`).classList.add('active');
        
        if (tabName === 'review') loadReviewMode();
        else if (tabName === 'bulk') loadBulkMode();
        else if (tabName === 'learning') loadLearningMode();
      });
    });

    // Load stats
    async function loadStats() {
      try {
        const res = await fetch(API_BASE + '/list?limit=1', { method: 'POST' });
        const data = await res.json();
        document.getElementById('uncategorizedCount').textContent = data.counts.uncategorized;
        document.getElementById('categorizedCount').textContent = data.counts.categorized;
        document.getElementById('correctedCount').textContent = data.counts.recentlyCorrected;
      } catch (err) {
        console.error('Error loading stats:', err);
      }
    }

    // REVIEW & FIX MODE
    async function loadReviewMode() {
      try {
        const res = await fetch(API_BASE + '/list?limit=100&offset=0&dateFilter=all', { method: 'POST' });
        const data = await res.json();
        pendingChanges.clear();
        renderReviewTable(data.transactions);
      } catch (err) {
        console.error('Error loading review mode:', err);
        showToast('Error loading transactions', 'error');
      }
    }

    function renderReviewTable(transactions) {
      const table = document.getElementById('reviewTable');
      if (transactions.length === 0) {
        table.innerHTML = '<div class="empty-state"><h3>No transactions</h3></div>';
        return;
      }

      let html = '';
      transactions.forEach(txn => {
        const amount = parseFloat(txn.amount);
        const isExpense = amount < 0;
        const displayAmount = Math.abs(amount).toFixed(2);
        const currentCat = pendingChanges.get(txn.id) || txn.currentCategory || '';

        html += `
          <div class="transaction-row">
            <div class="transaction-date">${txn.date}</div>
            <div class="transaction-desc" title="${txn.description}">${txn.description}</div>
            <div class="transaction-amount ${isExpense ? 'expense' : ''}">$${displayAmount}</div>
            <select class="category-select" data-id="${txn.id}" data-original="${txn.currentCategory}">
              <option value="">Uncategorized</option>
              ${CATEGORIES.map(cat => `<option value="${cat}" ${currentCat === cat ? 'selected' : ''}>${cat}</option>`).join('')}
            </select>
          </div>
        `;
      });

      table.innerHTML = html;

      // Add change listeners
      document.querySelectorAll('.category-select').forEach(select => {
        select.addEventListener('change', (e) => {
          const id = parseInt(e.target.dataset.id);
          const oldValue = e.target.dataset.original;
          const newValue = e.target.value;

          if (newValue !== oldValue) {
            pendingChanges.set(id, newValue);
          } else {
            pendingChanges.delete(id);
          }

          updateChangesStatus();
        });
      });
    }

    function updateChangesStatus() {
      const count = pendingChanges.size;
      document.getElementById('changesStatus').textContent = count > 0 ? `${count} change(s) pending` : '';
      document.getElementById('saveChangesBtn').disabled = count === 0;
    }

    document.getElementById('saveChangesBtn').addEventListener('click', async () => {
      if (pendingChanges.size === 0) return;

      const updates = Array.from(pendingChanges.entries()).map(([id, newCategory]) => ({
        id,
        newCategory
      }));

      try {
        const res = await fetch(API_BASE + '/update-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ updates })
        });

        const data = await res.json();
        showToast(`Updated ${data.updated} transactions`, 'success');
        pendingChanges.clear();
        updateChangesStatus();
        loadStats();
        loadReviewMode();
      } catch (err) {
        console.error('Error saving changes:', err);
        showToast('Error saving changes', 'error');
      }
    });

    // BULK EDITOR MODE
    async function loadBulkMode() {
      try {
        const res = await fetch(API_BASE + '/category-summary', { method: 'POST' });
        const data = await res.json();
        renderCategoryList(data.categories);
        renderBulkCategorySelect();
      } catch (err) {
        console.error('Error loading bulk mode:', err);
        showToast('Error loading categories', 'error');
      }
    }

    function renderCategoryList(categories) {
      const list = document.getElementById('categoryList');
      let html = categories.map(cat => `
        <div class="category-item" data-category="${cat.category}">
          <span>${cat.category || 'Uncategorized'}</span>
          <span class="category-count">${cat.count}</span>
        </div>
      `).join('');

      list.innerHTML = html;

      document.querySelectorAll('.category-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          currentCategory = item.dataset.category;
          loadBulkTransactions(currentCategory);
        });
      });
    }

    function renderBulkCategorySelect() {
      const select = document.getElementById('bulkCategorySelect');
      select.innerHTML = '<option value="">Move selected to...</option>' + 
        CATEGORIES.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    }

    async function loadBulkTransactions(category) {
      try {
        const res = await fetch(API_BASE + '/by-category', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, limit: 100, offset: 0 })
        });

        const data = await res.json();
        renderBulkTable(data.transactions);
      } catch (err) {
        console.error('Error loading transactions:', err);
        showToast('Error loading transactions', 'error');
      }
    }

    function renderBulkTable(transactions) {
      const table = document.getElementById('bulkTable');
      if (transactions.length === 0) {
        table.innerHTML = '<div class="empty-state"><h3>No transactions</h3></div>';
        return;
      }

      let html = '';
      transactions.forEach(txn => {
        const amount = parseFloat(txn.amount);
        const isExpense = amount < 0;
        const displayAmount = Math.abs(amount).toFixed(2);

        html += `
          <div class="transaction-row" style="grid-template-columns: 30px 80px 1fr 100px;">
            <input type="checkbox" class="transaction-checkbox" data-id="${txn.id}">
            <div class="transaction-date">${txn.date}</div>
            <div class="transaction-desc">${txn.description}</div>
            <div class="transaction-amount ${isExpense ? 'expense' : ''}">$${displayAmount}</div>
          </div>
        `;
      });

      table.innerHTML = html;

      document.querySelectorAll('.transaction-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedCheckboxes.add(parseInt(e.target.dataset.id));
          } else {
            selectedCheckboxes.delete(parseInt(e.target.dataset.id));
          }
          document.getElementById('bulkMoveBtn').disabled = selectedCheckboxes.size === 0;
        });
      });
    }

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      const checkboxes = document.querySelectorAll('.transaction-checkbox');
      const allChecked = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);
      
      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
        cb.dispatchEvent(new Event('change'));
      });
    });

    document.getElementById('bulkMoveBtn').addEventListener('click', async () => {
      const category = document.getElementById('bulkCategorySelect').value;
      if (!category || selectedCheckboxes.size === 0) return;

      const updates = Array.from(selectedCheckboxes).map(id => ({
        id,
        newCategory: category
      }));

      try {
        const res = await fetch(API_BASE + '/update-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ updates })
        });

        const data = await res.json();
        showToast(`Moved ${data.updated} transactions to ${category}`, 'success');
        selectedCheckboxes.clear();
        loadStats();
        loadBulkMode();
      } catch (err) {
        console.error('Error moving transactions:', err);
        showToast('Error moving transactions', 'error');
      }
    });

    // LEARNING MODE
    async function loadLearningMode() {
      try {
        const res = await fetch(API_BASE + '/patterns', { method: 'POST' });
        const data = await res.json();
        renderPatterns(data.patterns);
      } catch (err) {
        console.error('Error loading patterns:', err);
        showToast('Error loading patterns', 'error');
      }
    }

    function renderPatterns(patterns) {
      const list = document.getElementById('patternsList');
      if (patterns.length === 0) {
        list.innerHTML = '<div class="empty-state"><h3>No patterns found</h3><p>Need at least 3 transactions with same description to suggest patterns</p></div>';
        return;
      }

      let html = patterns.map(pattern => {
        const categories = Object.entries(pattern.currentCategories)
          .map(([cat, count]) => `<div class="category-badge">${cat} (${count})</div>`)
          .join('');

        return `
          <div class="pattern-card">
            <div class="pattern-info">
              <div class="pattern-keyword">${pattern.keyword}</div>
              <div class="pattern-stats">
                <span class="pattern-stat">📊 ${pattern.count} transactions</span>
              </div>
              <div class="pattern-categories">${categories || '<span class="category-badge">No category</span>'}</div>
              <div style="font-size: 13px; color: var(--text-secondary);">Suggest: <strong>${pattern.suggestedCategory}</strong></div>
            </div>
            <div class="pattern-actions">
              <button class="btn-sm yes" data-keyword="${pattern.keyword}" data-category="${pattern.suggestedCategory}">Yes</button>
              <button class="btn-sm">No</button>
            </div>
          </div>
        `;
      }).join('');

      list.innerHTML = html;

      document.querySelectorAll('.btn-sm.yes').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const keyword = e.target.dataset.keyword;
          const category = e.target.dataset.category;

          try {
            const res = await fetch(API_BASE + '/learn-pattern', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ keyword, suggestedCategory: category })
            });

            const data = await res.json();
            showToast(`${data.message}`, 'success');
            loadStats();
            loadLearningMode();
          } catch (err) {
            console.error('Error learning pattern:', err);
            showToast('Error learning pattern', 'error');
          }
        });
      });
    }

    // Initial load
    loadStats();
    loadReviewMode();
  </script>
</body>
</html>
