<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Categorizations - MyFinanceApp</title>
    <style>
        :root {
            --primary: #4a9eff;
            --primary-dark: #2e6fc4;
            --success: #51cf66;
            --danger: #ff6b6b;
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #2a3f5f;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 28px; font-weight: 600; color: var(--text-primary); }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-item { display: flex; flex-direction: column; gap: 4px; }
        .stat-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }

        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .main-layout {
            display: grid;
            grid-template-columns: 0.75fr 2fr;
            gap: 20px;
            min-height: 500px;
        }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scrollable {
            flex: 1;
            overflow-y: auto;
            max-height: 600px;
        }

        /* CARD STYLES */
        .card {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s ease;
        }
        .card:last-child { border-bottom: none; }
        .card:hover { background: var(--bg-tertiary); }

        /* CATEGORY CARDS */
        .cat-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .cat-info { display: flex; flex-direction: column; gap: 4px; }
        .cat-name { font-weight: 600; font-size: 15px; }
        .cat-count { font-size: 12px; color: var(--text-secondary); }
        .cat-amount { font-weight: 700; color: var(--primary); }

        /* TRANSACTION CARDS */
        .txn-card {
            display: grid;
            grid-template-columns: 70px 1fr 100px;
            gap: 12px;
            align-items: center;
        }
        .txn-date { font-size: 12px; color: var(--text-secondary); }
        .txn-desc { 
            font-size: 14px; 
            font-weight: 500; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .txn-amount { text-align: right; font-weight: 700; }
        .txn-amount.expense { color: var(--danger); }
        .txn-amount.income { color: var(--success); }

        .txn-detail {
            grid-column: 1 / -1;
            margin-top: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .category-select {
            flex: 1;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 13px;
        }

        /* PATTERN CARDS */
        .pattern-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pattern-keyword { font-weight: 600; color: var(--primary); font-size: 15px; }
        .pattern-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }
        .btn-apply {
            padding: 8px 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* LOADING */
        .loading { padding: 40px; text-align: center; color: var(--text-secondary); }
        
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Transaction Categorizations</h1>
        </div>

        <div class="stats-bar" id="stats-bar">
            <div class="stat-item">
                <div class="stat-label">Uncategorized</div>
                <div class="stat-value" id="stat-uncategorized">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Total Transactions</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Accuracy Rate</div>
                <div class="stat-value" id="stat-accuracy">0%</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active">Review & Organize</button>
        </div>

        <div class="main-layout">
            <!-- LEFT PANEL: CATEGORY LIST -->
            <div class="panel">
                <div class="panel-header">Categories</div>
                <div class="scrollable" id="category-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <!-- MIDDLE PANEL: TRANSACTION LIST -->
            <div class="panel">
                <div class="panel-header">
                    <span id="current-view-title">All Transactions</span>
                    <span id="txn-count" class="cat-count">0 items</span>
                </div>
                <div class="scrollable" id="txn-list">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allCategories = [];
        let currentCategory = 'All';

        async function init() {
            await loadSummaries();
            await loadTransactions();
        }

        async function loadSummaries() {
            try {
                const res = await fetch('/api/categorizations/list?dateFilter=all', { method: 'POST' });
                const data = await res.json();
                
                const stats = data.counts;
                const total = stats.uncategorized + stats.categorized;
                const accuracy = total > 0 ? Math.round((stats.categorized / total) * 100) : 0;

                document.getElementById('stat-uncategorized').textContent = stats.uncategorized;
                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-accuracy').textContent = accuracy + '%';

                const summaryRes = await fetch('/api/categorizations/category-summary', { method: 'POST' });
                const summaryData = await summaryRes.json();
                
                allCategories = summaryData.categories;
                renderCategories(summaryData.categories);
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        function renderCategories(categories) {
            const list = document.getElementById('category-list');
            list.innerHTML = categories.map(cat => `
                <div class="card cat-card ${currentCategory === cat.category ? 'active' : ''}" onclick="selectCategory('${cat.category}')">
                    <div class="cat-info">
                        <div class="cat-name">${cat.category}</div>
                        <div class="cat-count">${cat.count} transactions</div>
                    </div>
                </div>
            `).join('');
        }

        async function selectCategory(cat) {
            currentCategory = cat;
            document.getElementById('current-view-title').textContent = cat;
            renderCategories(allCategories);
            await loadTransactions(cat);
        }

        async function loadTransactions(cat = null) {
            const list = document.getElementById('txn-list');
            list.innerHTML = '<div class="loading">Loading transactions...</div>';

            try {
                let url = '/api/categorizations/list?limit=100';
                let body = {};
                let res;

                if (cat && cat !== 'All') {
                    res = await fetch('/api/categorizations/by-category', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category: cat })
                    });
                } else {
                    res = await fetch(url, { method: 'POST' });
                }

                const data = await res.json();
                const txns = data.transactions || [];
                
                document.getElementById('txn-count').textContent = txns.length + ' items';
                
                list.innerHTML = txns.map(t => `
                    <div class="card txn-card">
                        <div class="txn-date">${new Date(t.date).toISOString().split('T')[0]}</div>
                        <div class="txn-desc">${t.description}</div>
                        <div class="txn-amount ${t.amount < 0 ? 'expense' : 'income'}">
                            $${Math.abs(t.amount).toFixed(2)}
                        </div>
                        <div class="txn-detail">
                            <select class="category-select" onchange="updateCategory('${t.id}', this.value)">
                                <option value="">Uncategorized</option>
                                ${allCategories.map(c => `<option value="${c.category}" ${t.currentcategory === c.category ? 'selected' : ''}>${c.category}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<div class="loading">Error loading transactions</div>';
            }
        }

        async function updateCategory(id, newCategory) {
            try {
                await fetch('/api/categorizations/update-batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates: [{ id, newCategory }] })
                });
                showToast(`Updated to ${newCategory}`);
                await loadSummaries();
            } catch (err) {
                showToast('Update failed', true);
            }
        }

        async function loadPatterns() {
            const list = document.getElementById('pattern-list');
            try {
                const res = await fetch('/api/categorizations/patterns', { method: 'POST' });
                const data = await res.json();
                
                list.innerHTML = data.patterns.map(p => `
                    <div class="card pattern-card">
                        <div class="pattern-keyword">"${p.keyword}"</div>
                        <div class="pattern-meta">
                            <span>Matches ${p.count} items</span>
                            <span>Suggest: ${p.suggestedCategory}</span>
                        </div>
                        <button class="btn-apply" onclick="applyPattern('${p.keyword}', '${p.suggestedCategory}')">Apply to All</button>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<div class="loading">No suggestions found</div>';
            }
        }

        async function applyPattern(keyword, category) {
            showToast('Suggestions have been removed.');
        }

        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            if (isError) toast.style.borderLeftColor = 'var(--danger)';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        init();
    </script>
</body>
</html>
