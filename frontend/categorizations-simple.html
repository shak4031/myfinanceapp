<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Categorizations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1419;
            color: #e0e0e0;
            padding: 24px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        h1 { font-size: 28px; margin-bottom: 20px; }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #1a1f2e;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 0 1 auto;
        }
        
        .stat-label { font-size: 12px; color: #a0a0a0; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; color: #4a9eff; margin-top: 5px; }
        
        .table-wrapper {
            background: #1a1f2e;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: auto;
            max-height: 600px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        th {
            background: #0f1419;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #2a3f5f;
        }
        
        tr:hover { background: #2a3f5f; }
        
        .date { width: 100px; }
        .description { width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .amount { width: 100px; text-align: right; font-weight: 600; }
        .category { width: 120px; }
        .actions { width: 200px; }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 4px;
        }
        
        .btn-confirm {
            background: #51cf66;
            color: #000;
            font-weight: 600;
        }
        
        .btn-confirm:hover { background: #40c057; }
        
        .btn-change {
            background: #4a9eff;
            color: #fff;
        }
        
        .btn-change:hover { background: #339af0; }
        
        select {
            padding: 6px 8px;
            background: #2a3f5f;
            border: 1px solid #333;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-pending { background: #2a3f5f; color: #a0a0a0; }
        .status-confirmed { background: #51cf66; color: #000; }
        .status-modified { background: #ffd93d; color: #000; }
        
        .pagination {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        
        .pagination button {
            padding: 8px 12px;
            background: #2a3f5f;
            border: 1px solid #333;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .pagination button:hover { background: #4a9eff; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .loading { text-align: center; padding: 40px; color: #a0a0a0; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #333; border-top: 3px solid #4a9eff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Review & Confirm Categorizations</h1>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Total Transactions</div>
                <div class="stat-value" id="stat-total">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Confirmed</div>
                <div class="stat-value" id="stat-confirmed">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Modified</div>
                <div class="stat-value" id="stat-modified">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Pending Review</div>
                <div class="stat-value" id="stat-pending">-</div>
            </div>
        </div>
        
        <div class="table-wrapper" id="tableWrapper">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px;">Loading transactions...</p>
            </div>
        </div>
        
        <div class="pagination">
            <button id="prevBtn" onclick="previousPage()">← Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextBtn" onclick="nextPage()">Next →</button>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let allTransactions = [];
        let transactionStatuses = {};
        const perPage = 20;
        
        async function loadTransactions() {
            try {
                // Load all transactions
                const res = await fetch('/api/transactions');
                const data = await res.json();
                allTransactions = data || [];
                
                // Load transaction statuses
                const statusRes = await fetch('/api/dashboard/category-summary');
                const statusData = await statusRes.json();
                
                // Initialize stats
                updateStats();
                renderPage();
            } catch (err) {
                console.error('Error loading transactions:', err);
                document.getElementById('tableWrapper').innerHTML = `
                    <div class="loading">
                        <p style="color: #ff6b6b;">Error loading transactions</p>
                        <p style="margin-top: 10px; font-size: 12px; color: #a0a0a0;">${err.message}</p>
                    </div>
                `;
            }
        }
        
        function updateStats() {
            document.getElementById('stat-total').textContent = allTransactions.length;
            document.getElementById('stat-pending').textContent = allTransactions.length;
        }
        
        function renderPage() {
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageTransactions = allTransactions.slice(start, end);
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th class="date">Date</th>
                            <th class="description">Description</th>
                            <th class="amount">Amount</th>
                            <th class="category">Category</th>
                            <th class="actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            pageTransactions.forEach(tx => {
                const amount = parseFloat(tx.amount || 0);
                const direction = tx.direction || 'DEBIT';
                const amountStr = direction === 'CREDIT' ? '+$' + Math.abs(amount).toFixed(2) : '-$' + Math.abs(amount).toFixed(2);
                const categoryDisplay = tx.category || 'Uncategorized';
                
                html += `
                    <tr data-id="${tx.txn_id}">
                        <td class="date">${tx.date}</td>
                        <td class="description" title="${tx.description}">${tx.description}</td>
                        <td class="amount">${amountStr}</td>
                        <td class="category">${categoryDisplay}</td>
                        <td class="actions">
                            <button class="btn btn-confirm" onclick="confirmTransaction(${tx.txn_id})">✓ Confirm</button>
                            <select class="category-select" onchange="changeCategory(${tx.txn_id}, this.value)">
                                <option value="">Change...</option>
                                <option value="Salary">Salary</option>
                                <option value="Groceries">Groceries</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Insurance">Insurance</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Dining">Dining</option>
                                <option value="Car Payment">Car Payment</option>
                                <option value="Rent">Rent</option>
                                <option value="Subscription">Subscription</option>
                                <option value="Education">Education</option>
                                <option value="Other">Other</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            document.getElementById('tableWrapper').innerHTML = html;
            
            // Update pagination
            const totalPages = Math.ceil(allTransactions.length / perPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }
        
        function confirmTransaction(id) {
            transactionStatuses[id] = 'confirmed';
            document.querySelectorAll(`tr[data-id="${id}"] .status-badge`).forEach(el => {
                el.textContent = '✓ Confirmed';
                el.className = 'status-badge status-confirmed';
            });
            alert('Transaction confirmed!');
        }
        
        function changeCategory(id, newCategory) {
            if (!newCategory) return;
            transactionStatuses[id] = 'modified';
            
            // Find and update the transaction
            const tx = allTransactions.find(t => t.txn_id === id);
            if (tx) {
                tx.category = newCategory;
            }
            
            renderPage();
            alert(`Category changed to ${newCategory}!`);
        }
        
        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        }
        
        function nextPage() {
            const totalPages = Math.ceil(allTransactions.length / perPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        }
        
        // Load on startup
        loadTransactions();
    </script>
</body>
</html>
