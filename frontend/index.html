<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFinanceApp v2</title>
  <style>
    :root {
      --primary: #4a9eff;
      --primary-dark: #2e6fc4;
      --primary-light: #6ab5ff;
      --success: #51cf66;
      --danger: #ff6b6b;
      --warning: #ffd93d;
      --bg-primary: #0f1419;
      --bg-secondary: #1a1f2e;
      --bg-tertiary: #2a3f5f;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border: #333;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
      --transition: all 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* APP LAYOUT */
    .app-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-list { display: flex; flex-direction: column; gap: 10px; list-style: none; }
    
    .nav-btn {
      width: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
    }

    .nav-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-btn.active { background: var(--primary); color: white; }

    /* MAIN CONTENT */
    .main-content {
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .view { display: none; flex-direction: column; gap: 32px; }
    .view.active { display: flex; }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 32px; font-weight: 700; }

    /* BUTTONS */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }
    
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* METRICS */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .metric-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .metric-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
    .metric-value { font-size: 28px; font-weight: 700; color: var(--primary); }

    /* 3-PANEL CATEGORIES LAYOUT */
    .panel-container {
      display: grid;
      grid-template-columns: 280px 1.5fr 1fr;
      gap: 24px;
      height: 600px;
    }

    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    .panel-body { flex: 1; overflow-y: auto; }

    .list-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
    }
    .list-item:hover { background: var(--bg-tertiary); }
    .list-item.active { border-left: 4px solid var(--primary); background: var(--bg-tertiary); }

    /* TRANSACTION ROW */
    .txn-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      gap: 12px;
      align-items: center;
    }
    .txn-amount { text-align: right; font-weight: 700; color: var(--danger); }
    .txn-amount.income { color: var(--success); }

    /* TOAST */
    .toast-container { position: fixed; bottom: 32px; right: 32px; z-index: 1000; }
    .toast {
      padding: 16px 24px;
      background: var(--bg-secondary);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-top: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

  </style>
</head>
<body>
  <div class="app-container">
    <!-- NAVIGATION -->
    <aside class="sidebar">
      <div class="sidebar-logo">💰 MyFinanceApp</div>
      <ul class="nav-list">
        <li><button class="nav-btn active" onclick="showView('dashboard')">📊 Dashboard</button></li>
        <li><button class="nav-btn" onclick="showView('categories')">🏷️ Categories</button></li>
        <li><button class="nav-btn" onclick="showView('transactions')">💰 Transactions</button></li>
      </ul>
    </aside>

    <!-- CONTENT AREA -->
    <main class="main-content">
      
      <!-- DASHBOARD -->
      <section id="dashboard-view" class="view active">
        <header class="header">
          <h1>Dashboard</h1>
          <button class="btn btn-primary">📥 Import Statements</button>
        </header>

        <div class="metrics-grid" id="dashboard-metrics"></div>

        <div>
          <h2 style="margin-bottom: 20px;">📅 Upcoming Payments</h2>
          <div class="metrics-grid" id="dashboard-payments"></div>
        </div>
      </section>

      <!-- CATEGORIES (REBUILT 3-PANEL) -->
      <section id="categories-view" class="view">
        <header class="header">
          <h1>Categories</h1>
        </header>

        <div class="panel-container">
          <!-- PANEL 1: CATEGORY LIST -->
          <div class="panel">
            <div class="panel-header">Groups</div>
            <div class="panel-body" id="cat-list"></div>
          </div>

          <!-- PANEL 2: TRANSACTIONS -->
          <div class="panel">
            <div class="panel-header" id="txn-header">Transactions</div>
            <div class="panel-body" id="txn-list">
              <div style="padding: 40px; text-align: center; color: var(--text-secondary);">Select a category to view items</div>
            </div>
          </div>

          <!-- PANEL 3: SUGGESTIONS -->
          <div class="panel">
            <div class="panel-header">Suggestions</div>
            <div class="panel-body" id="suggestion-list"></div>
          </div>
        </div>
      </section>

      <!-- TRANSACTIONS -->
      <section id="transactions-view" class="view">
        <header class="header">
          <h1>Transactions</h1>
        </header>
        <!-- Transaction Table Placeholder -->
        <div class="panel" style="padding: 24px;">
          <table style="width: 100%; border-collapse: collapse;">
            <thead style="text-align: left; color: var(--text-secondary);">
              <tr><th style="padding: 12px;">Date</th><th>Description</th><th style="text-align: right; padding: 12px;">Amount</th></tr>
            </thead>
            <tbody id="full-txn-table"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script>
    // NAVIGATION
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`${viewId}-view`).classList.add('active');
      const clickedBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.textContent.toLowerCase().includes(viewId));
      if (clickedBtn) clickedBtn.classList.add('active');
      
      if (viewId === 'dashboard') loadDashboard();
      if (viewId === 'categories') loadCategories();
      if (viewId === 'transactions') loadAllTransactions();
    }

    // DASHBOARD LOGIC
    async function loadDashboard() {
      const res = await fetch('/api/dashboard/summary', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dateFilter: 'all'})});
      const data = await res.json();
      
      document.getElementById('dashboard-metrics').innerHTML = `
        <div class="metric-card"><div class="metric-label">Income</div><div class="metric-value" style="color: var(--success)">$${data.income.toFixed(2)}</div></div>
        <div class="metric-card"><div class="metric-label">Expenses</div><div class="metric-value" style="color: var(--danger)">$${Math.abs(data.expenses).toFixed(2)}</div></div>
        <div class="metric-card"><div class="metric-label">Net</div><div class="metric-value">$${data.netCashflow.toFixed(2)}</div></div>
        <div class="metric-card"><div class="metric-label">Balance</div><div class="metric-value" style="color: var(--primary)">$${data.balance.toFixed(2)}</div></div>
      `;

      const payRes = await fetch('/api/dashboard/upcoming-payments', { method: 'POST' });
      const payments = await payRes.json();
      document.getElementById('dashboard-payments').innerHTML = payments.slice(0, 4).map(p => `
        <div class="metric-card">
          <div class="metric-label">${p.category}</div>
          <div class="metric-value" style="font-size: 20px;">$${p.totalAmount.toFixed(2)}</div>
          <div style="font-size: 11px; color: var(--text-secondary);">${p.items.length} upcoming items</div>
        </div>
      `).join('');
    }

    // CATEGORIES LOGIC (3-PANEL REWRITE)
    async function loadCategories() {
      const res = await fetch('/api/categorizations/category-summary', { method: 'POST' });
      const data = await res.json();
      
      document.getElementById('cat-list').innerHTML = data.categories.map(c => `
        <div class="list-item" onclick="loadCategoryTransactions('${c.category}')">
          <div style="font-weight: 600;">${c.category || 'Uncategorized'}</div>
          <div style="font-size: 12px; color: var(--text-secondary);">${c.count} transactions</div>
        </div>
      `).join('');

      loadSuggestions();
    }

    async function loadCategoryTransactions(cat) {
      document.getElementById('txn-header').textContent = `Transactions: ${cat}`;
      const res = await fetch('/api/categorizations/by-category', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({category: cat, limit: 100})});
      const data = await res.json();
      
      document.getElementById('txn-list').innerHTML = data.transactions.map(t => `
        <div class="list-item txn-row">
          <div style="font-size: 11px; color: var(--text-secondary);">${t.date}</div>
          <div style="font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${t.description}">${t.description}</div>
          <div class="txn-amount">$${Math.abs(t.amount).toFixed(2)}</div>
        </div>
      `).join('');
    }

    async function loadSuggestions() {
      const res = await fetch('/api/categorizations/patterns', { method: 'POST' });
      const data = await res.json();
      document.getElementById('suggestion-list').innerHTML = data.patterns.map(p => `
        <div class="list-item">
          <div style="font-weight: 600; color: var(--primary);">"${p.keyword}"</div>
          <div style="font-size: 12px; margin-bottom: 8px;">Used in ${p.count} items</div>
          <button class="btn btn-secondary" style="background: var(--success); color: white; padding: 4px 8px; font-size: 11px;" 
                  onclick="applyPattern('${p.keyword}', '${p.suggestedCategory}')">Set to ${p.suggestedCategory}</button>
        </div>
      `).join('');
    }

    async function applyPattern(keyword, category) {
      await fetch('/api/categorizations/learn-pattern', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({keyword, suggestedCategory: category})});
      notify(`✓ Updated items matching "${keyword}"`);
      loadCategories();
    }

    function notify(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.getElementById('toasts').appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    loadDashboard();
  </script>
</body>
</html>
