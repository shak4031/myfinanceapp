<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFinanceApp v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1419; color: #e0e0e0; }
    .container { display: flex; height: 100vh; }
    .sidebar { width: 250px; background: #1a1f2e; padding: 20px; border-right: 1px solid #333; }
    .sidebar h1 { font-size: 18px; margin-bottom: 30px; color: #4a9eff; }
    .sidebar button { display: block; width: 100%; padding: 12px; margin: 10px 0; background: #2a3f5f; border: none; color: #e0e0e0; cursor: pointer; border-radius: 6px; font-size: 14px; }
    .sidebar button.active { background: #4a9eff; color: #fff; }
    .main { flex: 1; overflow-y: auto; }
    .page { display: none; padding: 30px; }
    .page.active { display: block; }
    .page h2 { font-size: 28px; margin-bottom: 30px; color: #4a9eff; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .metric { background: #1a1f2e; padding: 20px; border-radius: 8px; border-left: 4px solid #4a9eff; }
    .metric-label { color: #999; font-size: 12px; text-transform: uppercase; }
    .metric-value { font-size: 24px; font-weight: bold; color: #4a9eff; margin-top: 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: #1a1f2e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
    .card h3 { color: #4a9eff; margin-bottom: 15px; }
    .card-item { padding: 12px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    .card-item:last-child { border-bottom: none; }
    .loading { text-align: center; color: #999; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>💰 MyFinanceApp</h1>
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="debts">Debt Payoff</button>
      <button class="tab-btn" data-tab="insights">Insights</button>
      <button class="tab-btn" data-tab="projects">Projects</button>
    </div>

    <div class="main">
      <!-- Dashboard Tab -->
      <div class="page active" id="dashboard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0;">Dashboard</h2>
          <button onclick="openImportModal()" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;">📥 Import CSV</button>
        </div>
        <div class="metrics" id="metrics">
          <div class="loading">Loading...</div>
        </div>
        <h3>Upcoming Payments</h3>
        <div class="cards" id="upcoming">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <!-- Debt Payoff Tab -->
      <div class="page" id="debts">
        <h2>Debt Payoff Plan</h2>
        <div class="card">
          <h3>Credit Cards</h3>
          <div id="debt-list">
            <div class="loading">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Insights Tab -->
      <div class="page" id="insights">
        <h2>Financial Insights</h2>
        <div class="card">
          <h3>Spending Analysis</h3>
          <p>Insights coming soon...</p>
        </div>
      </div>

      <!-- Projects Tab -->
      <div class="page" id="projects">
        <h2>Savings Goals & Projects</h2>
        <div class="card">
          <h3>Your Goals</h3>
          <div id="goals-list">
            <div class="loading">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const log = (cat, msg) => console.log(`[${new Date().toLocaleTimeString()}] [${cat}] ${msg}`);

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        log('UI', `Switching to ${btn.dataset.tab}`);
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        loadData(btn.dataset.tab);
      });
    });

    async function loadData(tab) {
      try {
        if (tab === 'dashboard') {
          log('API', 'Fetching dashboard summary');
          const summaryRes = await fetch('/api/dashboard/summary', { method: 'POST' });
          const summary = await summaryRes.json();
          
          document.getElementById('metrics').innerHTML = `
            <div class="metric">
              <div class="metric-label">Monthly Income</div>
              <div class="metric-value">$${summary.monthlyIncome.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            </div>
            <div class="metric">
              <div class="metric-label">Monthly Expenses</div>
              <div class="metric-value">$${summary.monthlyExpenses.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            </div>
            <div class="metric">
              <div class="metric-label">Net Cashflow</div>
              <div class="metric-value" style="color: ${summary.netCashFlow >= 0 ? '#51cf66' : '#ff6b6b'}">
                $${summary.netCashFlow.toLocaleString('en-US', {minimumFractionDigits: 2})}
              </div>
            </div>
            <div class="metric">
              <div class="metric-label">Current Balance</div>
              <div class="metric-value">$${summary.currentBalance.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
            </div>
          `;

          log('API', 'Fetching upcoming payments');
          const payRes = await fetch('/api/dashboard/upcoming-payments', { method: 'POST' });
          const payments = await payRes.json();
          
          document.getElementById('upcoming').innerHTML = payments.items.map(item => `
            <div class="card">
              <h3>${item.name}</h3>
              <div class="card-item">
                <span>Amount:</span>
                <strong>$${item.amount.toFixed(2)}</strong>
              </div>
              <div class="card-item">
                <span>Date:</span>
                <strong>${item.date}</strong>
              </div>
              <div class="card-item">
                <span>Type:</span>
                <strong>${item.type === 'income' ? '💚 Income' : '💳 Expense'}</strong>
              </div>
            </div>
          `).join('');
        }

        if (tab === 'debts') {
          log('API', 'Fetching debt cards');
          const res = await fetch('/api/debts');
          const data = await res.json();
          document.getElementById('debt-list').innerHTML = data.cards.map(card => `
            <div class="card-item">
              <strong>${card.name}</strong>
              <div>$${card.balance.toFixed(2)} @ ${card.apr}%</div>
            </div>
          `).join('');
        }

        if (tab === 'projects') {
          log('API', 'Fetching savings goals');
          const res = await fetch('/api/goals');
          const data = await res.json();
          document.getElementById('goals-list').innerHTML = data.goals.map(goal => `
            <div class="card-item">
              <strong>${goal.name}</strong>
              <div>$${goal.current_amount.toFixed(2)} / $${goal.target_amount.toFixed(2)}</div>
            </div>
          `).join('');
        }
      } catch (error) {
        log('ERROR', error.message);
        document.querySelector(`#${tab} .loading`).innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    }

    log('APP', 'MyFinanceApp loaded');
    loadData('dashboard');
  </script>

  <!-- CSV Import Modal -->
  <div id="importModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: #1a1f2e; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%; border: 1px solid #333;">
      <h2 style="margin-top: 0; color: #4a9eff;">📥 Import CSV Statements</h2>
      
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 10px; color: #aaa; font-size: 12px; text-transform: uppercase;">Source</label>
        <select id="importSource" style="width: 100%; padding: 10px; background: #2a3f5f; color: #fff; border: 1px solid #444; border-radius: 5px;">
          <option value="td-checking">TD Bank - Checking</option>
          <option value="td-savings">TD Bank - Savings</option>
          <option value="credit-card">Credit Card Statement</option>
        </select>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 10px; color: #aaa; font-size: 12px; text-transform: uppercase;">CSV File</label>
        <input type="file" id="csvFile" accept=".csv" style="width: 100%; padding: 10px; background: #2a3f5f; color: #fff; border: 1px solid #444; border-radius: 5px;">
      </div>

      <div id="importStatus" style="margin-bottom: 20px; padding: 15px; background: #2a3f5f; border-radius: 5px; display: none; color: #aaa; font-size: 14px;">
        <p id="importStatusText"></p>
      </div>

      <div style="display: flex; gap: 10px;">
        <button onclick="closeImportModal()" style="flex: 1; padding: 10px; background: #2a3f5f; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
        <button onclick="handleImport()" style="flex: 1; padding: 10px; background: #4CAF50; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Import</button>
      </div>
    </div>
  </div>

  <script>
  function openImportModal() {
    document.getElementById('importModal').style.display = 'flex';
    document.getElementById('csvFile').value = '';
    document.getElementById('importStatus').style.display = 'none';
  }

  function closeImportModal() {
    document.getElementById('importModal').style.display = 'none';
  }

  async function handleImport() {
    const source = document.getElementById('importSource').value;
    const file = document.getElementById('csvFile').files[0];
    
    if (!file) {
      alert('Please select a CSV file');
      return;
    }

    const statusDiv = document.getElementById('importStatus');
    const statusText = document.getElementById('importStatusText');
    statusDiv.style.display = 'block';
    statusText.textContent = 'Importing...';

    try {
      const csvData = await file.text();
      
      const response = await fetch('/api/import/import-csv', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csvData, source })
      });

      const result = await response.json();

      if (result.success) {
        statusText.innerHTML = `
          <strong style="color: #51cf66;">✓ Import Complete!</strong><br>
          Imported: ${result.imported}<br>
          Duplicates: ${result.duplicates}<br>
          Errors: ${result.errors}<br>
          Total: ${result.total}
        `;
        
        setTimeout(() => {
          loadData('dashboard');
          closeImportModal();
        }, 2000);
      } else {
        statusText.innerHTML = `<strong style="color: #ff6b6b;">❌ Import Failed</strong><br>${result.error}`;
      }
    } catch (err) {
      statusText.innerHTML = `<strong style="color: #ff6b6b;">❌ Error</strong><br>${err.message}`;
    }
  }

  document.getElementById('importModal')?.addEventListener('click', (e) => {
    if (e.target.id === 'importModal') {
      closeImportModal();
    }
  });
  </script>
</body>
</html>
